name: Build fnOS Flash Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Download base inputs from own Release
        run: |
          set -euo pipefail
          mkdir -p base
          cd base
          gh release download base-inputs \
            --repo ${{ github.repository }} \
            --pattern "boot.img" \
            --pattern "rootfs.tar.gz" \
            --pattern "dtbo.img" \
            --dir .
          echo "Downloaded:"
          ls -lh
          test -f boot.img
          test -f rootfs.tar.gz
          echo "Base inputs verified."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lzma zip

      - name: Determine changed files
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD || echo "")
          else
            CHANGED=$(git diff --name-only origin/main...HEAD || echo "")
          fi
          echo "modified=${CHANGED}" >> $GITHUB_OUTPUT
          echo "Changed files:"
          echo "${CHANGED}"

      - name: Show toolchain status
        run: |
          echo "=== tools 脚本检查 ==="
          ls -la tools/
          bash -n tools/init_script.sh && echo "init_script.sh 语法 OK"
          for f in tools/*.py; do python3 -m py_compile "$f" && echo "$f 语法 OK"; done

      - name: Verify recovery installer scripts
        run: |
          bash -n flash-package/META-INF/com/google/android/update-binary && echo "update-binary 语法 OK"
          test -f flash-package/META-INF/com/google/android/updater-script && echo "updater-script 存在"

      - name: Assemble standard flashable zip
        run: |
          set -euo pipefail
          rm -rf pkg
          mkdir -p pkg
          # 基础镜像
          cp base/boot.img pkg/
          cp base/dtbthem  2>/dev/null || true
          cp base/dtbo.img pkg/ 2>/dev/null || true
          cp base/rootfs.tar.gz pkg/
          # Recovery 刷机脚本
          cp -r flash-package/META-INF pkg/
          # 参考文件（不参与刷机）
          if [ -d config ]; then cp -r config pkg/config; fi
          if [ -f docs/troubleshooting.md ]; then cp docs/troubleshooting.md pkg/; fi
          echo "=== pkg 内容 ==="
          find pkg -type f | head -30
          # 打包成标准卡刷 zip（rootfs 大文件不压缩，加快解压）
          cd pkg
          zip -0 -r ../fnos-k20pro-Card_Brush_Package.zip META-INF boot.img rootfs.tar.gz
          if [ -f dtbo.img ]; then zip -0 ../fnos-k20pro-Card_Brush_Package.zip dtbo.img; fi
          if [ -d config ]; then zip -r ../fnos-k20pro-Card_Brush_Package.zip config; fi
          if [ -f troubleshooting.md ]; then zip -r ../fnos-k20pro-Card_Brush_Package.zip troubleshooting.md; fi
          cd ..
          echo "=== 产物 ==="
          ls -lh fnos-k20pro-Card_Brush_Package.zip
          md5sum fnos-k20pro-Card_Brush_Package.zip > checksums.txt
          cat checksums.txt

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            fnos-k20pro-Card_Brush_Package.zip
            checksums.txt
          tag_name: build-${{ github.sha }}-${{ github.run_id }}
          name: Build ${{ github.sha }} (run ${{ github.run_id }})
          body: |
            Automated build from commit ${{ github.sha }}.
            Modified files: ${{ steps.changes.outputs.modified }}
            This is a STANDARD Recovery flashable zip.
            " Flash via TWRP/OrangeFox directly. ",
            backup: 进入 TWRP -> Wipe -> Format data 前请先备份。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
