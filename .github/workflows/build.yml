name: Build fnOS Flash Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Download upstream flash package
        run: |
          set -euo pipefail
          mkdir -p upstream
          cd upstream

          echo "Downloading via gh release download (fast CDN)..."
          gh release download \
            fnos-k20pro-raphael \
            --repo oneder32/fnos-k20pro-raphael \
            --pattern "Redmi_K20pro_FnOS_Card_Brush_Package.*" \
            --dir .

          echo "Renaming to fixed filenames..."
          # gh 下载后文件名是完整原始名，统一重命名
          if ls Redmi_K20pro_FnOS_Card_Brush_Package.z01 >/dev/null 2>&1; then
            mv -f Redmi_K20pro_FnOS_Card_Brush_Package.z01 card.z01
          fi
          if ls Redmi_K20pro_FnOS_Card_Brush_Package.z02 >/dev/null 2>&1; then
            mv -f Redmi_K20pro_FnOS_Card_Brush_Package.z02 card.z02
          fi
          if ls Redmi_K20pro_FnOS_Card_Brush_Package.zip >/dev/null 2>&1; then
            mv -f Redmi_K20pro_FnOS_Card_Brush_Package.zip card.zip
          fi

          echo "Downloaded files:"
          ls -lh

          # 合并多卷 zip 并修复结构
          echo "Merging zip volumes..."
          cat card.z01 card.z02 card.zip > full.zip
          zip -FF full.zip --out fixed.zip -f -v > /tmp/zipff.log 2>&1 || true
          echo "--- zip -FF log ---"
          cat /tmp/zipff.log

          # 验证修复后的 zip
          if ! unzip -tq fixed.zip >/dev/null 2>&1; then
            echo "zip -FF failed, trying alternative repair..."
            zip -FF full.zip --out fixed2.zip -F -q
            mv fixed2.zip fixed.zip
          fi

      - name: Extract base images
        run: |
          set -euo pipefail
          mkdir -p base
          cd base
          unzip -q ../upstream/fixed.zip
          echo "Extracted files:"
          ls -lh

          # 验证关键文件存在
          test -f boot.img
          test -f rootfs.tar.gz
          echo "Base images verified."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lzma

      - name: Determine changed files
        id: changes
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD || echo "")
          echo "modified=${CHANGED}" >> $GITHUB_OUTPUT
          echo "All changed files:"
          echo "${CHANGED}"

      - name: Patch rootfs
        if: contains(steps.changes.outputs.modified, 'tools/') || contains(steps.changes.outputs.modified, 'config/') || contains(steps.changes.outputs.modified, 'init_script.sh') || contains(steps.changes.outputs.modified, 'flash.sh')
        run: |
          set -euo pipefail
          mkdir -p work
          cd work
          python3 ../tools/patch_rootfs.py --base $(pwd)/..
          python3 ../tools/build_drivers_overlay.py --base $(pwd)/..
          python3 ../tools/merge_drivers.py --base $(pwd)/..
          echo "Rootfs patched and drivers merged."

      - name: Repack boot.img
        if: contains(steps.changes.outputs.modified, 'tools/init_script.sh')
        run: |
          set -euo pipefail
          mkdir -p work
          cd work
          python3 ../tools/repack_boot.py --base $(pwd)/..
          python3 ../tools/make_dtbo.py --base $(pwd)/..
          echo "boot.img repacked."

      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cd base

          if [ -f ../work/boot_fnos_k20pro.img ]; then
            cp ../work/boot_fnos_k20pro.img dist/
          else
            cp boot.img dist/boot_fnos_k20pro.img
          fi

          if [ -f ../work/dtbo.img ]; then
            cp ../work/dtbo.img dist/
          elif [ -f dtbo.img ]; then
            cp dtbo.img dist/
          fi

          if [ -f ../work/fnos_k20pro_rootfs.tar.gz ]; then
            cp ../work/fnos_k20pro_rootfs.tar.gz dist/rootfs.tar.gz
          elif [ -f rootfs.tar.gz ]; then
            cp rootfs.tar.gz dist/
          fi

          cd dist
          zip -r ../flash-package.zip .
          echo "Package created:"
          ls -lh ../flash-package.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: flash-package.zip
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.sha }}
          body: |
            Automated build from commit ${{ github.sha }}.
            Modified files: ${{ steps.changes.outputs.modified }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
