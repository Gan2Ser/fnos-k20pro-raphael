name: Build fnOS Flash Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Download base inputs from own Release
        run: |
          set -euo pipefail
          mkdir -p base
          cd base
          # 从本仓库 base-inputs Release 下载（秒级，不再碰上游 2.1GB 分卷）
          gh release download base-inputs \
            --repo ${{ github.repository }} \
            --pattern "boot.img" \
            --pattern "rootfs.tar.gz" \
            --pattern "dtbo.img" \
            --dir .
          echo "Downloaded:"
          ls -lh

          # 验证关键文件
          test -f boot.img
          test -f rootfs.tar.gz
          echo "Base inputs verified."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lzma

      - name: Determine changed files
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD || echo "")
          else
            CHANGED=$(git diff --name-only origin/main...HEAD || echo "")
          fi
          echo "modified=${CHANGED}" >> $GITHUB_OUTPUT
          echo "Changed files:"
          echo "${CHANGED}"

      - name: Show toolchain status (always)
        run: |
          echo "=== tools 脚本检查 ==="
          ls -la tools/
          bash -n tools/init_script.sh && echo "init_script.sh 语法 OK"
          for f in tools/*.py; do python3 -m py_compile "$f" && echo "$f 语法 OK"; done

      - name: Patch rootfs (if needed)
        if: always()
        env:
          MODIFIED: ${{ steps.changes.outputs.modified }}
        run: |
          set -euo pipefail
          echo "=== patch_rootfs.py 尝试 ==="
          # 需要 work/trimfs.tgz；基础 rootfs 已烘焙驱动，先尝试直接解压验证
          mkdir -p work
          python3 tools/patch_rootfs.py --base "$(pwd)" 2>&1 || echo "patch_rootfs 跳过（无 trimfs.tgz）"
          python3 tools/build_drivers_overlay.py --base "$(pwd)" 2>&1 || echo "build_drivers_overlay 跳过（无 boot_fnos_k20pro.img）"
          python3 tools/merge_drivers.py --base "$(pwd)" 2>&1 || echo "merge_drivers 跳过"

      - name: Repack boot.img
        if: always()
        run: |
          set -euo pipefail
          echo "=== repack_boot.py 尝试 ==="
          mkdir -p work
          # 从 base/boot.img 提取 initramfs 需要原始构建文件；没有则跳过
          python3 tools/repack_boot.py --base "$(pwd)" 2>&1 || echo "repack_boot 跳过（缺 boot.img 构建输入）"
          python3 tools/make_dtbo.py --base "$(pwd)" 2>&1 || echo "make_dtbo 跳过"

      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          # 如果生成了新镜像则用新的，否则保留上游基础文件
          cd base
          for f in boot.img rootfs.tar.gz dtbo.img; do
            if [ -f "../work/${f}" ]; then
              cp "../work/${f}" "../dist/${f}"
            else
              cp "${f}" "../dist/${f}"
            fi
          done
          # 附加修改过的 config/ 供参考
          if [ -d ../config ]; then
            cp -r ../config ../dist/config
          fi
          if [ -f ../docs/troubleshooting.md ]; then
            cp ../docs/troubleshooting.md ../dist/
          fi
          cd ../dist
          echo "=== 产物清单 ==="
          ls -lh
          echo "$(sha256sum *)" > checksums.txt
          zip -r ../fnos-k20pro-flash-package.zip . -x "*.git*"

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: fnos-k20pro-flash-package.zip
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.sha }}
          body: |
            Automated build from commit ${{ github.sha }}.
            Modified files: ${{ steps.changes.outputs.modified }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
