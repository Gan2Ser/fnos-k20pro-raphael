name: Build fnOS Flash Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Download base inputs from own Release
        run: |
          set -euo pipefail
          mkdir -p base
          cd base
          gh release download base-inputs \
            --repo ${{ github.repository }} \
            --pattern "boot.img" \
            --pattern "rootfs.tar.gz" \
            --pattern "dtbo.img" \
            --dir .
          echo "Downloaded:"
          ls -lh
          test -f boot.img
          test -f rootfs.tar.gz
          echo "Base inputs verified."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lzma zip

      - name: Determine changed files
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD || echo "")
          else
            CHANGED=$(git diff --name-only origin/main...HEAD || echo "")
          fi
          echo "modified=${CHANGED}" >> $GITHUB_OUTPUT
          echo "Changed files:"
          echo "${CHANGED}"

      - name: Patch rootfs directly
        if: always()
        run: |
          set -euo pipefail
          mkdir -p work
          cd work
          python3 ../tools/patch_rootfs.py --base "$(pwd)/.."
          echo "rootfs patch exit: $?"

      - name: Repack boot.img directly
        if: always()
        run: |
          set -euo pipefail
          mkdir -p work
          cd work
          python3 ../tools/repack_boot.py --base "$(pwd)/.."
          echo "boot repack exit: $?"

      - name: Assemble standard split flashable zip
        run: |
          set -euo pipefail
          rm -rf pkg
          mkdir -p pkg
          cd base
          if [ -f ../work/boot_fnos_k20pro.img ]; then
            cp ../work/boot_fnos_k20pro.img ../pkg/boot.img
          else
            cp boot.img ../pkg/boot.img
          fi
          if [ -f ../work/dtbo.img ]; then
            cp ../work/dtbo.img ../pkg/ 2>/dev/null || true
          elif [ -f dtbo.img ]; then
            cp dtbo.img ../pkg/ 2>/dev/null || true
          fi
          if [ -f ../work/rootfs_patched.tar.gz ]; then
            cp ../work/rootfs_patched.tar.gz ../pkg/rootfs.tar.gz
          else
            cp rootfs.tar.gz ../pkg/rootfs.tar.gz
          fi
          cp -r ../flash-package/META-INF ../pkg/
          if [ -d ../config ]; then cp -r ../config ../pkg/config; fi
          if [ -f ../docs/troubleshooting.md ]; then cp ../docs/troubleshooting.md ../pkg/; fi
          echo "=== pkg 内容 ==="
          find ../pkg -type f | head -30

          cd pkg
          zip -0 -r -s 1900m ../fnos-k20pro-Card_Brush_Package.zip \
            META-INF boot.img dtbo.img rootfs.tar.gz 2>/dev/null
          if [ -d config ]; then
            zip -0 -r -s 1900m ../fnos-k20pro-Card_Brush_Package.zip config 2>/dev/null || true
          fi
          cd ..

          echo "=== 分卷产物 ==="
          ls -lh fnos-k20pro-Card_Brush_Package.*
          md5sum fnos-k20pro-Card_Brush_Package.* > checksums.txt
          cat checksums.txt

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            fnos-k20pro-Card_Brush_Package.z01
            fnos-k20pro-Card_Brush_Package.z02
            fnos-k20pro-Card_Brush_Package.zip
            checksums.txt
          tag_name: build-${{ github.sha }}-${{ github.run_id }}
          name: Build ${{ github.sha }} (run ${{ github.run_id }})
          body: |
            Automated build from commit ${{ github.sha }}.
            Modified files: ${{ steps.changes.outputs.modified }}

            ## 使用方法（Windows）
            1. 下载全部 3 个分卷到同一文件夹，保持文件名不变
            2. 用 7-Zip / Bandizip 打开 `fnos-k20pro-Card_Brush_Package.z01`，
               它会自动识别分卷并合并解压，得到完整卡刷包内容
            3. 或者合并成完整 zip 后刷入：
               ```
               copy /b fnos-k20pro-Card_Brush_Package.z01 + fnos-k20pro-Card_Brush_Package.z02 + fnos-k20pro-Card_Brush_Package.zip fnos-full.zip
               ```
            4. 把 fnos-full.zip 拷入手机，TWRP/OrangeFox 直接刷入
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
